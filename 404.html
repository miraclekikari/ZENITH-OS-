<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Zenith OS - Redirecting...</title>
    <script>
      const basePath = '/ZENITH-OS-'; // The base path of the repository
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;

      // Correctly extract the path relative to the basePath
      // Example: /ZENITH-OS-/foo -> /foo
      const pagePath = path.startsWith(basePath) ? path.substring(basePath.length) : path;

      sessionStorage.setItem('redirectPath', pagePath + search);

      // Redirect to the root of the project with the path in the hash
      window.location.replace(
        basePath + '/'
        + (search ? '' + search : '')
        + '#' 
        + pagePath
        + (hash ? hash : '')
      );
    </script>
  </head>
  <body>
    <p>If you are not redirected automatically, <a href="/ZENITH-OS-/">click here</a>.</p>
  </body>
</html>
