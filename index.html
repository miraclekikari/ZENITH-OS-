<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Zenith Core OS</title>

    <script>
      window.tailwind.config = {
        theme: {
          extend: {
            colors: {
              // On définit ici tes couleurs exactes pour que les classes bg-zenith-xxx fonctionnent
              zenith: {
                primary: '#00ffcc',
                secondary: '#0a0a0a',
                accent: '#ff0055',
                cyan: '#06b6d4'
              }
            }
          }
        }
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style type="text/css">
      :root {
        --zenith-neon: #00ffcc;
      }
      body {
        background-color: #0a0a0a; /* Force le fond noir si Tailwind met du temps à charger */
        color: #00ffcc;
        margin: 0;
      }
      .scanlines {
        position: fixed;
        inset: 0;
        background: linear-gradient(to bottom, rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
        background-size: 100% 4px;
        z-index: 50;
        pointer-events: none;
      }
    </style>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="scanlines"></div>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
