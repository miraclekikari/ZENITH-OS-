<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZENITH - Social System</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" crossorigin="anonymous" />
    <meta name="description" content="ZENITH : L'interface sociale nouvelle génération. Plongez dans un écosystème fluide au design OS, partagez vos stories sans limites et personnalisez votre expérience avec nos thèmes exclusifs. Connectez-vous au futur dès maintenant.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="/src/index.css" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9217335272764775" crossorigin="anonymous"></script>

    <style>
      /* Empêche le site de dépasser la largeur de l'écran */
      html, body {
        max-width: 100vw;
        overflow-x: hidden; /* Cache le défilement horizontal */
        margin: 0;
        padding: 0;
      }
      
      /* Force le conteneur principal React à s'adapter */
      #root {
        width: 100%;
        max-width: 100%;
        display: flex;
        flex-direction: column;
      }

      /* Sécurité pour ta div scanlines qui cause souvent des problèmes */
      .scanlines {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none; /* Permet de cliquer à travers */
        z-index: 9999;
      }
      
      /* Force les images et vidéos à ne pas dépasser */
      img, video, iframe {
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="scanlines"></div>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
