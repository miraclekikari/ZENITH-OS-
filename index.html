<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    
    <!-- === TITRE & META SEO === -->
    <title>ZENITH – Réseau social moderne et sécurisé (Congo-Brazzaville)</title>
    <meta name="description" content="ZENITH est un réseau social congolais axé sur la sécurité, les stories éphémères et les échanges privés. Rejoignez la communauté." />
    <meta name="keywords" content="ZENITH, réseau social, Congo-Brazzaville, Brazzaville, stories, sécurité, messagerie privée" />
    <meta name="author" content="ZENITH Team" />
    
    <!-- === OPEN GRAPH / RÉSEAUX SOCIAUX === -->
    <meta property="og:title" content="ZENITH – Réseau Social Congo" />
    <meta property="og:description" content="Stories éphémères, messagerie sécurisée et communautés. Rejoignez l'avenir du social à Brazza." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://miraclekikari.github.io/ZENITH-OS-/" />
    <meta property="og:image" content="https://miraclekikari.github.io/ZENITH-OS-/zenith-og-image.png" />
    <meta property="og:locale" content="fr_FR" />
    
    <!-- === ICÔNES & COULEUR THÈME === -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" crossorigin="anonymous" />
    <link rel="alternate icon" href="/favicon.ico" type="image/x-icon" /> <!-- Fallback pour anciens navigateurs -->
    <meta name="theme-color" content="#00ff88" /> <!-- Vert Zenith -->
    
    <!-- === CDN STABILISÉS (avec attributs complets) === -->
    <script src="https://cdn.tailwindcss.com" crossorigin="anonymous"></script>
    <link 
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"

      crossorigin="anonymous" 
      referrerpolicy="no-referrer" 
    />
    
    <!-- === CSS LOCAL (fallback) === -->
    <link rel="stylesheet" href="/src/index.css" />
    
    <!-- === GOOGLE ADSENSE (conservé à l'identique) === -->
    <script 
      async 
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9217335272764775"
      crossorigin="anonymous"
    ></script>
  </head>
  
  <body>
    <!-- Effet scanlines (défini dans index.css) -->
    <div class="scanlines"></div>
    
    <!-- Point d'entrée React -->
    <div id="root"></div>
    
    <!-- Script principal de l'application -->
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
